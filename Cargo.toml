[package]
name = "qeyes"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Mattia Moretti <maccabeo@gmail.com>"]
description = "A modern, cross-platform reimplementation of the classic X11 xeyes"
license = "MIT"
repository = "https://github.com/maccabeo/qeyes"
keywords = ["xeyes", "x11", "desktop", "eyes", "utility"]
categories = ["gui", "command-line-utilities"]

[lib]
name = "qeyes"
path = "src/lib.rs"

[[bin]]
name = "qeyes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
softbuffer = "0.4"
tiny-skia = "0.11"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr", "xinput", "resource_manager"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2", features = [
    "NSArray",
    "NSGeometry",
    "NSString",
] }

[dev-dependencies]
png = "0.17"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
